<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem("theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <script>
      // If the app fails while starting (before React renders anything), show
      // the reason instead of a blank page.
      function showStartupError(err) {
        var root = document.getElementById("root");
        if (!root || root.childNodes.length) return;
        var msg = (err && (err.errorMessage || err.message)) || String(err);
        var hint = window.isSecureContext
          ? ""
          : "<p>La pagina è aperta in HTTP da " + location.host + ". L'accesso Microsoft funziona solo in " +
            "<b>HTTPS</b> oppure da <b>http://localhost</b>: aprire l'app tramite HTTPS (reverse proxy) " +
            "o direttamente sul server da http://localhost:" + (location.port || "80") + ".</p>";
        root.innerHTML =
          '<div style="font-family:Roboto,sans-serif;max-width:640px;margin:64px auto;padding:0 16px;line-height:1.5">' +
          "<h1 style=\"font-family:Poppins,sans-serif\">Impossibile avviare l'app</h1>" + hint +
          '<pre style="white-space:pre-wrap;background:rgba(127,127,127,.12);padding:12px;border-radius:8px"></pre></div>';
        root.querySelector("pre").textContent = msg;
      }
      window.addEventListener("error", function (e) { showStartupError(e.error || e.message); });
      window.addEventListener("unhandledrejection", function (e) { showStartupError(e.reason); });
    </script>
    <title>Non conformità</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/env.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
