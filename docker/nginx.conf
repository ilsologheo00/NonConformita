server {
    listen 80;
    root /usr/share/nginx/html;

    # Built assets have hashed names: cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Always fetch the latest page and runtime configuration.
    location = /env.js {
        add_header Cache-Control "no-store";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
